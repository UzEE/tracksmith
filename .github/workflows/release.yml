name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: tracksmith-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Prove merged commit
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ github.event.pull_request.merge_commit_sha }}'
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$sha"
          git merge-base --is-ancestor "$sha" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-manager: false
          run-install: false
          cache: false
      - run: npm install --global npm@11.19.0
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test run
      - run: vp run package:smoke
      - run: vp run release
        env:
          GITHUB_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
