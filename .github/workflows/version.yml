name: Version

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: tracksmith-version
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-manager: false
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ github.token }}
          version-script: vp run version
          commit-message: 'chore: release tracksmith'
          pr-title: 'chore: release tracksmith'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false
      - name: Validate the version branch
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
